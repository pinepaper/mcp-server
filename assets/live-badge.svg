<svg xmlns="http://www.w3.org/2000/svg" width="300" height="104" viewBox="0 0 300 104" role="img" aria-label="LIVE status chip - widget loops forever">
  <defs>
    <linearGradient id="panelTint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#e8eff5"/>
    </linearGradient>
    <clipPath id="chipClip">
      <rect x="1.5" y="1.5" width="297" height="101" rx="10"/>
    </clipPath>
  </defs>

  <!-- chip panel: fill first, slate accent bar clipped inside, ink frame on top -->
  <rect x="1.5" y="1.5" width="297" height="101" rx="10" fill="url(#panelTint)"/>
  <rect x="1.5" y="1.5" width="6" height="101" fill="#2e5e8f" clip-path="url(#chipClip)"/>
  <rect x="1.5" y="1.5" width="297" height="101" rx="10" fill="none" stroke="#16202b" stroke-width="1.5"/>

  <!-- status dot: radar ping ring (born fully under the dot, fades in, nearly gone before the type column) -->
  <circle cx="34" cy="47" r="7" fill="none" stroke="#2e9b4e" stroke-width="1.4">
    <animate attributeName="r" values="6.3;15" keyTimes="0;1" dur="2s"
             calcMode="spline" keySplines="0.2 0.4 0.4 1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0.08;0" keyTimes="0;0.08;0.7;1" dur="2s"
             repeatCount="indefinite"/>
  </circle>
  <!-- status dot: breathes via r (true center pivot); peak at 0.1 so the ping reads as emitted by the breath -->
  <circle cx="34" cy="47" r="7" fill="#2e9b4e">
    <animate attributeName="r" values="7;8.3;7;7" keyTimes="0;0.1;0.45;1" dur="2s"
             calcMode="spline" keySplines="0.3 0 0.3 1;0.3 0 0.3 1;0 0 1 1"
             repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.85;1;1" keyTimes="0;0.1;0.45;1" dur="2s"
             calcMode="spline" keySplines="0.3 0 0.3 1;0.3 0 0.3 1;0 0 1 1"
             repeatCount="indefinite"/>
  </circle>

  <!-- left column: overline / display / caption -->
  <text x="58" y="23" font-family="Helvetica, Arial, sans-serif" font-size="7.5"
        letter-spacing="2.4" fill="#9aa3ab">STATUS</text>
  <text x="58" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="38"
        letter-spacing="0.5" fill="#16202b">LIVE</text>
  <text x="58" y="81" font-family="Helvetica, Arial, sans-serif" font-size="11"
        letter-spacing="0.3" fill="#57646f">widget &#183; loops forever</text>

  <!-- right column: hairline rule, big-stat serif number, loop-period meter, two-line caption -->
  <line x1="205" y1="26" x2="205" y2="82" stroke="#a9bfd4" stroke-width="1"/>
  <text x="219" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26"
        fill="#16202b">2.0s</text>
  <!-- meter track + sweep: fills while the ping expands, then clears; one visible loop period -->
  <line x1="219" y1="58.5" x2="271" y2="58.5" stroke="#a9bfd4" stroke-width="1"/>
  <line x1="219" y1="58.5" x2="271" y2="58.5" stroke="#2e5e8f" stroke-width="1.5"
        stroke-dasharray="52 52" stroke-dashoffset="52">
    <animate attributeName="stroke-dashoffset" values="52;0;-52" keyTimes="0;0.5;1" dur="2s"
             calcMode="spline" keySplines="0.4 0 0.3 1;0.4 0 0.3 1"
             repeatCount="indefinite"/>
  </line>
  <text x="219" y="72" font-family="Helvetica, Arial, sans-serif" font-size="8.5"
        letter-spacing="0.3" fill="#57646f">loop period</text>
  <text x="219" y="84" font-family="Helvetica, Arial, sans-serif" font-size="8.5"
        letter-spacing="0.3" fill="#9aa3ab">pure SMIL</text>

  <!-- footer credit -->
  <text x="289" y="95" text-anchor="end" font-family="Helvetica, Arial, sans-serif"
        font-size="7" letter-spacing="0.4" fill="#9aa3ab">pinepaper.studio</text>
</svg>