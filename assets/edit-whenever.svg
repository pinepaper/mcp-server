<rect x="430" y="214" height="3.5" width="0" fill="#ef4444" rx="1.75"><animate attributeName="width" values="0;0;92;92;0;0" keyTimes="0;.3667;.4;.475;.4833;1" begin="1.6s" dur="12s" repeatCount="indefinite"/></rect>
<text x="433" y="225" fill="#e6edf3" font-weight="bold" opacity="0">once.<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;.4833" begin="1.6s" dur="12s" repeatCount="indefinite"/></text>
<rect x="433" y="231" height="3" width="0" fill="#22c55e" rx="1.5"><animate attributeName="width" values="0;0;70;70" keyTimes="0;.5167;.5417;1" begin="1.6s" dur="12s" repeatCount="indefinite"/></rect>
