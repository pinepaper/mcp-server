<circle r="3" fill="#f59e0b"><animateTransform attributeName="transform" type="translate" values="0,0;35,35" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/></circle>
<circle r="3" fill="#55d7b3"><animateTransform attributeName="transform" type="translate" values="0,0;0,50" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/></circle>
