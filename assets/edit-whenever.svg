<circle r="3" fill="#00c3ff"><animateTransform attributeName="transform" type="translate" values="0,0;-50,0" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/></circle>
<circle r="3" fill="#f59e0b"><animateTransform attributeName="transform" type="translate" values="0,0;-35,-35" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/></circle>
<circle r="3" fill="#55d7b3"><animateTransform attributeName="transform" type="translate" values="0,0;0,-50" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/></circle>
<circle r="3" fill="#fffd1c"><animateTransform attributeName="transform" type="translate" values="0,0;35,-35" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="2.3s;6.3s;10.3s" fill="remove"/></circle>
</g>
<!-- swarm -->
<g opacity="0.55">
<circle r="3.2" fill="#22c55e"><animateMotion dur="8s" begin="0s" repeatCount="indefinite" path="M660,478 C580,438 520,518 450,480 C520,440 600,520 660,478 Z"/></circle>
<circle r="2.6" fill="#8b949e"><animateMotion dur="9.5s" begin="1.2s" repeatCount="indefinite" path="M680,463 C595,428 525,503 465,466 C540,428 610,508 680,463 Z"/></circle>
<circle r="2.2" fill="#00c3ff"><animateMotion dur="7s" begin="0.6s" repeatCount="indefinite" path="M645,496 C565,463 515,528 460,494 C530,458 590,530 645,496 Z"/></circle>
<circle r="2.8" fill="#f59e0b"><animateMotion dur="10.5s" begin="2s" repeatCount="indefinite" path="M692,480 C610,453 540,513 472,478 C550,446 620,516 692,480 Z"/></circle>
<circle r="2" fill="#55d7b3"><animateMotion dur="8.8s" begin="3.1s" repeatCount="indefinite" path="M668,470 C586,444 532,510 468,474 C536,438 606,512 668,470 Z"/></circle>
</g>
<!-- kicker story cycle (12s loop): once underlined > twice struck > thrice struck > once highlighted -->
<text x="288" y="225" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#8b949e" xml:space="preserve"><tspan fill-opacity="0">G<animate attributeName="fill-opacity" values="0;1" begin="0.20s" dur="0.05s" fill="freeze"/></tspan><tspan fill-opacity="0">e<animate attributeName="fill-opacity" values="0;1" begin="0.28s" dur="0.05s" fill="freeze"/></tspan><tspan fill-opacity="0">n<animate attributeName="fill-opacity" values="0;1" begin="0.36s" dur="0.05s" fill="freeze"/></tspan><tspan fill-opacity="0">e<animate attributeName="fill-opacity" values="0;1" begin="0.44s" dur="0.05s" fill="freeze"/></tspan><tspan fill-opacity="0">r<animate attributeName="fill-opacity" values="0;1" begin="0.52s" dur="0.05s" fill="freeze"/></tspan><tspan fill-opacity="0">a<animate attributeName="fill-opacity" values="0;1" begin="0.60s" dur="0.05s" fill="freeze"/></tspan><tspan fill-opacity="0">t<animate attributeName="fill-opacity" values="0;1" begin="0.68s" dur="0.05s" fill="freeze"/></tspan><tspan fill-opacity="0">e<animate attributeName="fill-opacity" values="0;1" begin="0.76s" dur="0.05s" fill="freeze"/></tspan></text>
<g font-family="Helvetica, Arial, sans-serif" font-size="30">
<rect x="429" y="201" height="31" width="0" fill="#f59e0b" opacity="0.28" rx="3"><animate attributeName="width" values="0;0;78;78" keyTimes="0;.4833;.5167;1" begin="1.6s" dur="12s" repeatCount="indefinite"/></rect>
<text x="433" y="225" fill="#8b949e" opacity="0">once.<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;.1833" begin="1.6s" dur="12s" repeatCount="indefinite"/></text>
<rect x="433" y="231" height="3" width="0" fill="#8b949e" rx="1.5"><animate attributeName="width" values="0;70;70;0;0" keyTimes="0;.025;.175;.1833;1" begin="1.6s" dur="12s" repeatCount="indefinite"/></rect>
<text x="433" y="225" fill="#8b949e" opacity="0">twice.<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;.1833;.3333" begin="1.6s" dur="12s" repeatCount="indefinite"/></text>
<rect x="430" y="214" height="3.5" width="0" fill="#ef4444" rx="1.75"><animate attributeName="width" values="0;0;82;82;0;0" keyTimes="0;.2167;.25;.325;.3333;1" begin="1.6s" dur="12s" repeatCount="indefinite"/></rect>
