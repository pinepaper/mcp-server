<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="800" height="600" viewBox="0 0 800 600">
<!-- PinePaper pinned-tweet master v2. Every element animates; no informational text.
     Effects showcased: print (kicker), scattered (headline assembly), colorwave (per-letter
     fill), wipe (underline bar), orbit (dot around period), pulse (period), fireworks,
     rings, swarm. Pure SMIL, no scripts. -->
<rect width="800" height="600" fill="#0d1117"/>
<!-- rings -->
<g stroke="#22c55e" fill="none" stroke-width="2">
<circle cx="132" cy="140" r="4"><animate attributeName="r" values="4;48" dur="3s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="132" cy="140" r="4"><animate attributeName="r" values="4;48" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="132" cy="140" r="4"><animate attributeName="r" values="4;48" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
</g>
<!-- fireworks (two emitters) -->
<g transform="translate(664,132)">
<circle r="3" fill="#f59e0b"><animateTransform attributeName="transform" type="translate" values="0,0;58,0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
<circle r="3" fill="#00c3ff"><animateTransform attributeName="transform" type="translate" values="0,0;41,41" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
<circle r="3" fill="#f59e0b"><animateTransform attributeName="transform" type="translate" values="0,0;0,58" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
<circle r="3" fill="#55d7b3"><animateTransform attributeName="transform" type="translate" values="0,0;-41,41" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
<circle r="3" fill="#f59e0b"><animateTransform attributeName="transform" type="translate" values="0,0;-58,0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
<circle r="3" fill="#00c3ff"><animateTransform attributeName="transform" type="translate" values="0,0;-41,-41" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
<circle r="3" fill="#fffd1c"><animateTransform attributeName="transform" type="translate" values="0,0;0,-58" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
<circle r="3" fill="#55d7b3"><animateTransform attributeName="transform" type="translate" values="0,0;41,-41" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/><animate attributeName="opacity" values="1;0" dur="1.6s" begin="0.4s;4.4s;8.4s" fill="remove"/></circle>
</g>
<g transform="translate(150,470)">
