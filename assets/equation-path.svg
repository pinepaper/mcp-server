<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 250" width="560" height="250" role="img" aria-label="Plate 07: the rose curve r equals cosine of two theta draws itself, then a slate dot rides the curve forever.">
  <title>The Equation Figure — r = cos(2θ)</title>

  <!-- paper -->
  <rect x="0" y="0" width="560" height="250" fill="#ffffff"/>

  <!-- ================= FIGURE STAGE (left) ================= -->
  <rect x="26" y="16" width="280" height="198" fill="#ffffff" stroke="#16202b" stroke-width="1.5"/>

  <!-- fig. number, book-style, top-left inside the stage -->
  <text x="38" y="34" font-family="Helvetica, Arial, sans-serif" font-size="8" letter-spacing="1.5" fill="#9aa3ab">FIG. 07</text>

  <!-- faint polar grid: rings at r = 1/3, 2/3, 1 and the two petal axes -->
  <g fill="none" stroke="#a9bfd4" stroke-width="0.75">
    <circle cx="166" cy="115" r="26"/>
    <circle cx="166" cy="115" r="52"/>
    <circle cx="166" cy="115" r="78"/>
    <line x1="88" y1="115" x2="244" y2="115" stroke-dasharray="5 5"/>
    <line x1="166" y1="37" x2="166" y2="193" stroke-dasharray="5 5"/>
  </g>
  <text x="230" y="53" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#9aa3ab">r = 1</text>

  <!-- the pole -->
  <circle cx="166" cy="115" r="1.8" fill="#16202b"/>

  <!-- the rose r = cos(2θ), inked on by an eased dashoffset reveal -->
  <path id="rosePath" fill="none" stroke="#16202b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"
        stroke-dasharray="755.4" stroke-dashoffset="755.4"
        d="M244 115L243.8 112.3L243.1 109.6L241.9 107L240.2 104.6L238.2 102.3L235.7 100.2L232.8 98.3L229.6 96.8L226 95.5L222.1 94.6L218 94L213.7 93.8L209.2 93.9L204.5 94.5L199.8 95.5L195 96.9L190.2 98.7L185.5 100.8L180.9 103.4L176.4 106.3L172.1 109.5L168 113.1L164.1 117L160.5 121.1L157.3 125.4L154.4 129.9L151.8 134.5L149.7 139.2L147.9 144L146.5 148.8L145.5 153.5L144.9 158.2L144.8 162.7L145 167L145.6 171.1L146.5 175L147.8 178.6L149.3 181.8L151.2 184.7L153.3 187.2L155.6 189.2L158 190.9L160.6 192.1L163.3 192.8L166 193L168.7 192.8L171.4 192.1L174 190.9L176.4 189.2L178.7 187.2L180.8 184.7L182.7 181.8L184.2 178.6L185.5 175L186.4 171.1L187 167L187.2 162.7L187.1 158.2L186.5 153.5L185.5 148.8L184.1 144L182.3 139.2L180.2 134.5L177.6 129.9L174.7 125.4L171.5 121.1L167.9 117L164 113.1L159.9 109.5L155.6 106.3L151.1 103.4L146.5 100.8L141.8 98.7L137 96.9L132.2 95.5L127.5 94.5L122.8 93.9L118.3 93.8L114 94L109.9 94.6L106 95.5L102.4 96.8L99.2 98.3L96.3 100.2L93.8 102.3L91.8 104.6L90.1 107L88.9 109.6L88.2 112.3L88 115L88.2 117.7L88.9 120.4L90.1 123L91.8 125.4L93.8 127.7L96.3 129.8L99.2 131.7L102.4 133.2L106 134.5L109.9 135.4L114 136L118.3 136.2L122.8 136.1L127.5 135.5L132.2 134.5L137 133.1L141.8 131.3L146.5 129.2L151.1 126.6L155.6 123.7L159.9 120.5L164 116.9L167.9 113L171.5 108.9L174.7 104.6L177.6 100.1L180.2 95.5L182.3 90.8L184.1 86L185.5 81.2L186.5 76.5L187.1 71.8L187.2 67.3L187 63L186.4 58.9L185.5 55L184.2 51.4L182.7 48.2L180.8 45.3L178.7 42.8L176.4 40.8L174 39.1L171.4 37.9L168.7 37.2L166 37L163.3 37.2L160.6 37.9L158 39.1L155.6 40.8L153.3 42.8L151.2 45.3L149.3 48.2L147.8 51.4L146.5 55L145.6 58.9L145 63L144.8 67.3L144.9 71.8L145.5 76.5L146.5 81.2L147.9 86L149.7 90.8L151.8 95.5L154.4 100.1L157.3 104.6L160.5 108.9L164.1 113L168 116.9L172.1 120.5L176.4 123.7L180.9 126.6L185.5 129.2L190.2 131.3L195 133.1L199.8 134.5L204.5 135.5L209.2 136.1L213.7 136.2L218 136L222.1 135.4L226 134.5L229.6 133.2L232.8 131.7L235.7 129.8L238.2 127.7L240.2 125.4L241.9 123L243.1 120.4L243.8 117.7L244 115Z">
    <animate attributeName="stroke-dashoffset" values="755.4;0" keyTimes="0;1"
             calcMode="spline" keySplines="0.42 0 0.16 1"
             begin="0.4s" dur="3.8s" fill="freeze"/>
  </path>

  <!-- the rider: snaps in at the petal tip as the ink finishes, then laps forever at arc-length pace -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="4.2s" dur="0.25s" fill="freeze"/>
    <circle r="8" fill="none" stroke="#2e5e8f" stroke-width="1" stroke-opacity="0.25"/>
    <circle r="4.2" fill="#2e5e8f"/>
    <animateMotion begin="4.2s" dur="9s" repeatCount="indefinite" rotate="0">
      <mpath xlink:href="#rosePath" href="#rosePath"/>
    </animateMotion>
  </g>

  <!-- serif caption beneath the stage, landing together with the finished figure at 4.2s -->
  <text x="166" y="236" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#16202b" opacity="0">r = cos(2θ)<animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.9s" fill="freeze"/></text>

  <!-- ================= TEXT COLUMN (right) ================= -->
  <text x="332" y="40" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="2" fill="#2e5e8f">PLATE 07 · EQUATION PATHS</text>
  <line x1="332" y1="50" x2="532" y2="50" stroke="#16202b" stroke-width="1"/>

  <text font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#16202b">
    <tspan x="332" y="80">Four petals,</tspan>
    <tspan x="332" y="103">drawn by one signal.</tspan>
  </text>

  <text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#57646f">
    <tspan x="332" y="126">The polar form is sampled into a path;</tspan>
    <tspan x="332" y="140">the dot is paced by arc length, so it</tspan>
    <tspan x="332" y="154">rides like a pen, not a metronome.</tspan>
  </text>

  <!-- code chip -->
  <rect x="332" y="170" width="200" height="24" fill="#eef2f6"/>
  <rect x="332" y="170" width="5" height="24" fill="#2e5e8f"/>
  <text x="345" y="185" font-family="'Courier New', monospace" font-size="10" fill="#16202b">createEquationPath('cos(2t)')</text>

  <!-- status line: dim until the ink completes, brightens at 4.2s, then blinks while tracing -->
  <circle cx="337.5" cy="211" r="3" fill="#2e9b4e" opacity="0.25">
    <animate attributeName="opacity" values="0.25;1" begin="4.2s" dur="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.5;1" begin="4.5s" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="347" y="214" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#57646f">tracing · θ from 0 to 2π · lap 9 s</text>

  <!-- footer credit -->
  <text x="532" y="242" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#9aa3ab">PinePaper Studio · hand-set SMIL · equation-path plate</text>
</svg>